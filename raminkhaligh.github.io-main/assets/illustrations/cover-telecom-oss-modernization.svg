<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="ossTitle">
  <title id="ossTitle">Documentation feeding a telecom microservice network, with team velocity climbing</title>
  <defs>
    <linearGradient id="ossBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#1a1025"/>
    </linearGradient>
    <radialGradient id="ossGlow" cx="0.28" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ossAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ossBg)"/>
  <rect width="800" height="450" fill="url(#ossGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/>
  </g>

  <!-- PRD/HLD document stack, left -->
  <g font-family="Arial, sans-serif">
    <text x="60" y="90" fill="#7a7a86" font-size="12" letter-spacing="1">PRD / HLD</text>
    <g transform="translate(60,110)">
      <rect x="10" y="14" width="86" height="106" rx="10" fill="#14141a" stroke="#2a2a33"/>
      <rect x="0" y="0" width="86" height="106" rx="10" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="14" y="20" width="58" height="7" rx="3.5" fill="#8b5cf6"/>
      <rect x="14" y="36" width="58" height="6" rx="3" fill="#3a3a45"/>
      <rect x="14" y="50" width="42" height="6" rx="3" fill="#3a3a45"/>
      <rect x="14" y="70" width="58" height="6" rx="3" fill="#2a2a33"/>
      <rect x="14" y="84" width="30" height="6" rx="3" fill="#2a2a33"/>
    </g>
  </g>

  <!-- routing path into network -->
  <path d="M170 165 C 240 165, 250 210, 320 220" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.6"/>

  <!-- microservice network graph, center -->
  <g stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M400 220 L470 165"/>
    <path d="M400 220 L470 275"/>
    <path d="M400 220 L330 275"/>
    <path d="M470 165 L470 275"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="400" cy="220" r="22" fill="url(#ossAccent)"/>
    <path d="M392 220h16M400 212v16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="470" cy="165" r="16" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="470" cy="275" r="16" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="330" cy="275" r="16" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" fill="#7a7a86" font-size="11" letter-spacing="1">TM FORUM COMPLIANT</text>
  </g>

  <!-- velocity gauge, right -->
  <g font-family="Arial, sans-serif">
    <text x="660" y="90" text-anchor="middle" fill="#7a7a86" font-size="12" letter-spacing="1">VELOCITY</text>
    <path d="M600 200 A60 60 0 0 1 720 200" fill="none" stroke="#2a2a33" stroke-width="10" stroke-linecap="round"/>
    <path d="M600 200 A60 60 0 0 1 700 155" fill="none" stroke="url(#ossAccent)" stroke-width="10" stroke-linecap="round"/>
    <line x1="660" y1="200" x2="695" y2="160" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="660" cy="200" r="6" fill="#fff"/>
    <text x="660" y="235" text-anchor="middle" fill="#c9bfff" font-size="18" font-weight="700">+30%</text>
  </g>

  <!-- team cluster -->
  <g transform="translate(560,300)" font-family="Arial, sans-serif">
    <circle cx="0" cy="0" r="12" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="22" cy="0" r="12" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="44" cy="0" r="12" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="11" cy="18" r="12" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="33" cy="18" r="12" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="70" y="14" fill="#e9e4ff" font-size="13" font-weight="700">14 Specialists</text>
    <text x="70" y="30" fill="#9a94ac" font-size="11">One vision</text>
  </g>

  <text x="60" y="400" fill="#7a7a86" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">DOCS → COMPLIANT SERVICES → VELOCITY</text>
</svg>
