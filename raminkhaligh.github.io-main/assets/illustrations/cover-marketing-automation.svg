<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="autoTitle">
  <title id="autoTitle">Event-driven lifecycle automation nudging a stalled user through the funnel</title>
  <defs>
    <linearGradient id="autoBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#1a1025"/>
    </linearGradient>
    <radialGradient id="autoGlow" cx="0.75" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="autoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#autoBg)"/>
  <rect width="800" height="450" fill="url(#autoGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/>
  </g>

  <!-- pipeline rail -->
  <line x1="90" y1="225" x2="710" y2="225" stroke="#2a2a33" stroke-width="3"/>
  <path d="M90 225 L 450 225" stroke="url(#autoAccent)" stroke-width="3"/>

  <!-- stage nodes -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(140,225)">
      <circle r="34" fill="#14141a" stroke="#8b5cf6" stroke-width="2.5"/>
      <path d="M-10 2l7 7 14-16" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" fill="#e9e4ff" font-size="14" font-weight="600">Registered</text>
    </g>

    <g transform="translate(320,225)">
      <circle r="34" fill="#14141a" stroke="#8b5cf6" stroke-width="2.5"/>
      <path d="M-11 -6h22v14h-22z M-11 -6l11 8 11-8" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" fill="#e9e4ff" font-size="14" font-weight="600">KYC Verified</text>
    </g>

    <g transform="translate(500,225)">
      <circle r="38" fill="#1c1424" stroke="#8b5cf6" stroke-width="3"/>
      <circle r="38" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.4">
        <animate attributeName="r" values="38;54;38" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M-4 -14c8 0 13 6 13 13 0 9-13 17-13 17s-13-8-13-17c0-7 5-13 13-13z" fill="#8b5cf6"/>
      <circle cx="-4" cy="-1" r="4" fill="#1c1424"/>
      <text y="66" fill="#e9e4ff" font-size="14" font-weight="700">Stalled — Nudged</text>
    </g>

    <g transform="translate(680,225)" opacity="0.55">
      <circle r="34" fill="#14141a" stroke="#3a3a45" stroke-width="2.5"/>
      <path d="M-10 -10l20 20M10 -10l-20 20" stroke="#5a5a66" stroke-width="2.2" stroke-linecap="round"/>
      <text y="60" fill="#8a8a96" font-size="14" font-weight="600">First Trade</text>
    </g>
  </g>

  <!-- push notification card -->
  <g transform="translate(430,90)" font-family="Arial, sans-serif">
    <rect width="230" height="70" rx="14" fill="#14141a" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <circle cx="30" cy="35" r="14" fill="url(#autoAccent)"/>
    <path d="M24 35a6 6 0 0112 0c0 4 2 6 3 7h-18c1-1 3-3 3-7z" fill="#fff"/>
    <text x="54" y="29" fill="#e9e4ff" font-size="12" font-weight="700">Finish your deposit</text>
    <text x="54" y="46" fill="#9a94ac" font-size="11">2 min left on your bonus</text>
    <path d="M430 140 L500 165" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 5" stroke-opacity="0.6" transform="translate(0,0)"/>
  </g>
  <path d="M500 160 L500 191" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 5" stroke-opacity="0.6"/>
</svg>
