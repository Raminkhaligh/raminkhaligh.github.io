<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="seoLoopTitle">
  <title id="seoLoopTitle">A social audience feeding into Google search, pushing organic rank from position six to number one</title>
  <defs>
    <linearGradient id="loopBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#1a1025"/>
    </linearGradient>
    <radialGradient id="loopGlow" cx="0.3" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loopAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#loopBg)"/>
  <rect width="800" height="450" fill="url(#loopGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/>
  </g>

  <!-- social sources, left -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(70,120)">
      <circle r="26" fill="#14141a" stroke="#2a2a33" stroke-width="2"/>
      <path d="M-11 2l6 6 14-16" fill="none" stroke="#8b5cf6" stroke-width="0" />
      <path d="M-11 -3l19-8-6 20-5-8-8-4z" fill="#8b5cf6"/>
      <text y="44" text-anchor="middle" fill="#8a8a96" font-size="11">Telegram</text>
    </g>
    <g transform="translate(70,220)">
      <rect x="-20" y="-20" width="40" height="40" rx="12" fill="#14141a" stroke="#2a2a33" stroke-width="2"/>
      <rect x="-10" y="-10" width="20" height="20" rx="6" fill="none" stroke="#8b5cf6" stroke-width="2.2"/>
      <circle cx="7" cy="-7" r="1.6" fill="#8b5cf6"/>
      <text y="44" text-anchor="middle" fill="#8a8a96" font-size="11">Instagram</text>
    </g>

    <path d="M100 120 C 180 120, 200 190, 260 195" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.55"/>
    <path d="M100 220 C 170 220, 200 200, 260 197" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.55"/>
  </g>

  <!-- search bar -->
  <g transform="translate(260,160)" font-family="Arial, sans-serif">
    <rect width="330" height="60" rx="30" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="34" cy="30" r="9" fill="none" stroke="#8b5cf6" stroke-width="2.4"/>
    <line x1="41" y1="37" x2="49" y2="45" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
    <text x="60" y="36" fill="#c9bfff" font-size="15">buy bitcoin usdt</text>
  </g>

  <!-- ranking climb, right -->
  <g font-family="Arial, sans-serif">
    <g opacity="0.4" transform="translate(560,275)">
      <rect width="180" height="34" rx="8" fill="#14141a" stroke="#3a3a45"/>
      <text x="14" y="22" fill="#7a7a86" font-size="12">Position 6 — buried</text>
    </g>
    <path d="M600 273 C 620 240, 630 210, 640 190" fill="none" stroke="#5a5a66" stroke-width="2" stroke-dasharray="3 6"/>

    <g transform="translate(560,150)">
      <rect width="180" height="46" rx="10" fill="url(#loopAccent)"/>
      <circle cx="26" cy="23" r="15" fill="#0b0d10"/>
      <text x="26" y="28" text-anchor="middle" fill="#e9e4ff" font-size="13" font-weight="700">#1</text>
      <text x="52" y="20" fill="#fff" font-size="12" font-weight="700">Organic result</text>
      <text x="52" y="35" fill="#e9e4ff" font-size="11" opacity="0.85">Top of page one</text>
    </g>
    <circle cx="560" cy="150" r="0" fill="none"/>
    <g transform="translate(650,150)" opacity="0.9">
      <circle r="20" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.4">
        <animate attributeName="r" values="20;30;20" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <text x="70" y="330" fill="#7a7a86" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">SOCIAL AUDIENCE → SEARCH SIGNAL → #1 RANK</text>
</svg>
