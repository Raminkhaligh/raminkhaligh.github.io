<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="walletTitle">
  <title id="walletTitle">A wallet deposit success notification firing the instant the exchange API confirms a claim</title>
  <defs>
    <linearGradient id="walletBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#1a1025"/>
    </linearGradient>
    <radialGradient id="walletGlow" cx="0.72" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="walletAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#walletBg)"/>
  <rect width="800" height="450" fill="url(#walletGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/>
  </g>

  <!-- search-to-rank arc, faded, top-left -->
  <g opacity="0.5" font-family="Arial, sans-serif">
    <path d="M70 260 C 130 150, 210 90, 300 70" fill="none" stroke="#3a3a45" stroke-width="2.5" stroke-dasharray="3 7"/>
    <circle cx="70" cy="260" r="6" fill="#5a5a66"/>
    <g transform="translate(300,70)">
      <circle r="14" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#c9bfff" font-size="13" font-weight="700">#1</text>
    </g>
    <text x="60" y="292" fill="#7a7a86" font-size="12" letter-spacing="1">POSITION 6 → #1</text>
  </g>

  <!-- phone frame with deposit success card -->
  <g transform="translate(280,80)">
    <rect x="0" y="0" width="230" height="300" rx="26" fill="#14141a" stroke="#2a2a33" stroke-width="2"/>
    <rect x="14" y="18" width="202" height="264" rx="10" fill="#101014"/>

    <!-- success badge -->
    <circle cx="115" cy="110" r="40" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.35">
      <animate attributeName="r" values="40;54;40" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="110" r="34" fill="url(#walletAccent)"/>
    <path d="M99 111l11 11 20-23" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="115" y="178" text-anchor="middle" fill="#e9e4ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Deposit Confirmed</text>
    <text x="115" y="200" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="20" font-weight="700">+20,404 USDT</text>

    <rect x="30" y="226" width="170" height="34" rx="17" fill="#1c1c24" stroke="#2a2a33"/>
    <text x="115" y="248" text-anchor="middle" fill="#9a94ac" font-family="Arial, sans-serif" font-size="12">Coin Pool reward credited</text>
  </g>

  <!-- API confirmation pulse to wallet -->
  <g font-family="Arial, sans-serif">
    <path d="M540 150 C 600 170, 620 220, 600 260" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.6"/>
    <g transform="translate(560,110)">
      <rect width="150" height="56" rx="14" fill="#14141a" stroke="#8b5cf6" stroke-opacity="0.7"/>
      <circle cx="28" cy="28" r="12" fill="url(#walletAccent)"/>
      <path d="M22 28l4 4 8-9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="50" y="24" fill="#e9e4ff" font-size="11" font-weight="700">API Confirmed</text>
      <text x="50" y="39" fill="#9a94ac" font-size="10">Instant credit</text>
    </g>
  </g>
</svg>
