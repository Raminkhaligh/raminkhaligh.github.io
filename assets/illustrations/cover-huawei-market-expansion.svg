<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="gtmTitle">
  <title id="gtmTitle">A curated product portfolio bundled and launched to capture 10% market share</title>
  <defs>
    <linearGradient id="gtmBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#1a1025"/>
    </linearGradient>
    <radialGradient id="gtmGlow" cx="0.26" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gtmAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gtmBg)"/>
  <rect width="800" height="450" fill="url(#gtmGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/>
  </g>

  <!-- global product pool, left: a grid of SKUs with one selected -->
  <g font-family="Arial, sans-serif">
    <text x="60" y="80" fill="#7a7a86" font-size="12" letter-spacing="1">GLOBAL PRODUCT POOL</text>
    <g transform="translate(60,100)">
      <rect width="44" height="44" rx="10" fill="#14141a" stroke="#2a2a33"/>
      <rect x="66" width="44" height="44" rx="10" fill="#14141a" stroke="#2a2a33"/>
      <rect x="132" width="44" height="44" rx="10" fill="#14141a" stroke="#8b5cf6" stroke-width="2.5"/>
      <rect x="0" y="58" width="44" height="44" rx="10" fill="#14141a" stroke="#2a2a33"/>
      <rect x="66" y="58" width="44" height="44" rx="10" fill="#14141a" stroke="#2a2a33"/>
      <rect x="132" y="58" width="44" height="44" rx="10" fill="#14141a" stroke="#2a2a33"/>
      <!-- selected tile check -->
      <circle cx="154" cy="22" r="9" fill="url(#gtmAccent)"/>
      <path d="M150 22l3 3 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- routing path to bundle card -->
  <path d="M255 122 C 330 122, 340 175, 390 190" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 6" stroke-opacity="0.6"/>

  <!-- bundle card: phone + earbuds -->
  <g transform="translate(390,150)" font-family="Arial, sans-serif">
    <rect width="210" height="130" rx="16" fill="#14141a" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="20" y="24" width="34" height="58" rx="8" fill="none" stroke="#e9e4ff" stroke-width="2"/>
    <circle cx="37" cy="72" r="2.4" fill="#e9e4ff"/>
    <circle cx="70" cy="46" r="9" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="70" cy="46" r="3" fill="#8b5cf6"/>
    <circle cx="86" cy="58" r="9" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="86" cy="58" r="3" fill="#8b5cf6"/>
    <text x="20" y="108" fill="#e9e4ff" font-size="13" font-weight="700">Mobile + Freelace</text>
    <text x="20" y="123" fill="#9a94ac" font-size="11">Nowruz bundle</text>
  </g>

  <!-- market share climb, right -->
  <g font-family="Arial, sans-serif">
    <text x="640" y="80" text-anchor="middle" fill="#7a7a86" font-size="12" letter-spacing="1">SHARE</text>
    <g transform="translate(610,300)">
      <rect x="0" y="-30" width="18" height="30" rx="4" fill="#2a2a33"/>
      <rect x="28" y="-55" width="18" height="55" rx="4" fill="#3a3a45"/>
      <rect x="56" y="-95" width="18" height="95" rx="4" fill="url(#gtmAccent)"/>
    </g>
    <g transform="translate(700,205)">
      <circle r="26" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.35">
        <animate attributeName="r" values="26;36;26" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="22" fill="url(#gtmAccent)"/>
      <text y="6" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">10%</text>
    </g>
  </g>

  <text x="60" y="400" fill="#7a7a86" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">SELECTION → BUNDLE → 10% SHARE</text>
</svg>
