<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="hmsTitle">
  <title id="hmsTitle">A Huawei device reconnected to a super app through a native HMS integration, replacing the severed GMS link</title>
  <defs>
    <linearGradient id="hmsBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#1a1025"/>
    </linearGradient>
    <radialGradient id="hmsGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hmsAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#hmsBg)"/>
  <rect width="800" height="450" fill="url(#hmsGlow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800"/>
    <path d="M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/>
  </g>

  <!-- severed GMS path (top, dimmed / broken) -->
  <g opacity="0.45">
    <path d="M230 150 C 330 120, 470 120, 570 150" fill="none" stroke="#5a5a66" stroke-width="2.5" stroke-dasharray="3 7"/>
    <g transform="translate(400,133)">
      <circle r="16" fill="#14141a" stroke="#e05252" stroke-width="2"/>
      <path d="M-6 -6l12 12M6 -6l-12 12" stroke="#e05252" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="400" y="100" text-anchor="middle" fill="#8a8a96" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">GMS — DISCONNECTED</text>
  </g>

  <!-- device (phone) -->
  <g transform="translate(150,190)">
    <rect x="0" y="0" width="140" height="230" rx="20" fill="#14141a" stroke="#2a2a33" stroke-width="2"/>
    <rect x="12" y="16" width="116" height="170" rx="6" fill="#1c1c24"/>
    <circle cx="70" cy="206" r="10" fill="none" stroke="#3a3a45" stroke-width="2"/>
    <!-- Huawei-style app grid -->
    <g fill="#8b5cf6">
      <rect x="26" y="34" width="30" height="30" rx="7"/>
      <rect x="66" y="34" width="30" height="30" rx="7" fill="#3a3a45"/>
      <rect x="26" y="74" width="30" height="30" rx="7" fill="#3a3a45"/>
      <rect x="66" y="74" width="30" height="30" rx="7"/>
    </g>
    <rect x="26" y="120" width="70" height="8" rx="4" fill="#3a3a45"/>
    <rect x="26" y="136" width="46" height="8" rx="4" fill="#2a2a33"/>
  </g>

  <!-- super app node -->
  <g transform="translate(600,255)">
    <circle r="46" fill="#14141a" stroke="#8b5cf6" stroke-width="2.5"/>
    <path d="M-18 8l10-24 8 12 8-16 10 28" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="70" text-anchor="middle" fill="#e9e4ff" font-family="Arial, sans-serif" font-size="14" font-weight="600">Super App</text>
  </g>

  <!-- new HMS bridge, glowing / active -->
  <path d="M290 300 C 400 340, 470 320, 554 275" fill="none" stroke="url(#hmsAccent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="422" cy="326" r="22" fill="#0b0d10" stroke="#8b5cf6" stroke-width="2.5"/>
  <path d="M422 316v20M412 326h20" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="422" y="368" text-anchor="middle" fill="#c9bfff" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HMS SDK</text>

  <!-- AppGallery badge -->
  <g transform="translate(600,90)" font-family="Arial, sans-serif">
    <rect width="150" height="52" rx="12" fill="#14141a" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <circle cx="28" cy="26" r="12" fill="url(#hmsAccent)"/>
    <path d="M23 26l3.5 3.5L34 21" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="23" fill="#e9e4ff" font-size="11" font-weight="700">AppGallery</text>
    <text x="50" y="37" fill="#9a94ac" font-size="10">1st Iranian app</text>
  </g>
</svg>
